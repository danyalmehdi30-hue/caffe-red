<head>

<body>

    <h1>Contact Caffe Red</h1>

    <!-- Navigation Links -->

    <p>
        <a href="index.html">Home</a> |
        <a href="menu.html">Menu</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="contact.html">Contact</a>

    <h2>Our Contact Information</h2>

    <p>Phone: 0305-1234567</p>

    <p>Email: caffered@example.com</p>

    <p>Opening Hours: 9:00 AM - 11:00 PM</p>

    <h2>Send Us a Message</h2>

    <form>

        <label for="name">Your Name:</label>
        <br>
        <input type="text" id="name" placeholder="Enter your name" required>

        <br><br>

        <label for="email">Your Email:</label>
        <br>
        <input type="email" id="email" placeholder="Enter your email" required>

        <br><br>

        <label for="message">Your Message:</label>
        <br>
        <textarea id="message" rows="5" cols="30" placeholder="Write your message" required></textarea>

        <br><br>

        <button type="button" onclick="alert('Thank you! Your message has been submitted.')">
            Submit
        </button>

    </form>

    <h2>Thank You for Visiting!</h2>

    <p>We look forward to seeing you at Caffe Red.</p>

</body>
